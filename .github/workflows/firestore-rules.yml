name: Firestore rules

# Проверяет правила на эмуляторе и публикует их в Firebase,
# когда в main меняется firestore.rules (или тесты к нему).
# Публикация нужна один раз настроенный секрет FIREBASE_SERVICE_ACCOUNT — см. README.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - tests/rules/**
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Test rules on the emulator
        run: npm run test:rules

      - name: Check deploy secret
        id: secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Секрет FIREBASE_SERVICE_ACCOUNT не задан — правила проверены, но НЕ опубликованы. Инструкция: README → «Автопубликация правил»."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy rules to Firebase
        if: steps.secret.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15.37.0 deploy --only firestore:rules --project wishlist-24cee --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
